<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tamm | Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <div class="app-layout">
      <aside class="sidebar">
        <img src="../images/logo.png" alt="Tamm Logo" class="logo" />

        <nav class="sidebar-nav">
          <a href="dashboard.html" class="nav-link active"> Dashboard </a>

          <a href="create-job.html" class="nav-link"> Create Job Request </a>

          <a href="my-jobs.html" class="nav-link"> My Job Requests </a>
        </nav>

        <a href="login.html" class="logout-link"> Log Out </a>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1>Dashboard</h1>

          <span class="user-chip" id="companyName"></span>
        </header>

        <section class="welcome-section">
          <h2 id="welcomeMessage"></h2>

          <p>Here's a quick overview of your account.</p>
        </section>

        <section class="dashboard-actions">
          <section class="stats-section">
            <article class="stat-card">
              <h3 id="openJobsCount">0</h3>

              <p>Open Job Requests</p>
            </article>

            <article class="stat-card">
              <h3 id="candidatesCount">0</h3>

              <p>New Candidates</p>
            </article>

            <article class="stat-card">
              <h3 id="closedJobsCount">0</h3>

              <p>Closed Requests</p>
            </article>
          </section>

          <a href="create-job.html" class="create-request-btn">
            + Create New Request
          </a>
        </section>
      </main>
    </div>

    <script src="../js/script.js"></script>
  </body>
</html>
